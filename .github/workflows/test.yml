name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install jq if missing
        run: |
          if command -v jq >/dev/null 2>&1; then
            exit 0
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y jq
          else
            brew install jq
          fi

      - name: Syntax check
        run: for f in plugin/scripts/*.sh tests/*.sh; do bash -n "$f" || exit 1; done

      - name: Test suite
        run: bash tests/test-session-handoff.sh
